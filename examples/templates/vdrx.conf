{
  "description": "Server-side HTML templates. greeter.py (a supervised script) answers requests with DATA only - a template name, params and rows - and vdrx's template engine renders ./templates/greeting.tpl. Run vdrx from this folder, then browse to http://localhost:8080/greeting?name=Jared",

  "variables": {
    "PYTHON_BIN_windows": "python",
    "PYTHON_BIN_linux": "python3",
    "PYTHON_BIN": "{PYTHON_BIN_{PLATFORM}}"
  },

  "settings": { "site_title": "vdrx templates demo" },

  "http_sites": [
    { "id": "web", "port": 8080, "template_dir": "templates" }
  ],

  "http_routes": [
    { "id": "greeter", "prefix": "/greeting", "allow": "GET" }
  ],

  "processes": [
    {
      "id": "greeter",
      "command": "{PYTHON_BIN} greeter.py",
      "subscribe": ["greeter.in"],
      "publish_allow": ["http.reply.*"],
      "restart": "always"
    }
  ]
}
