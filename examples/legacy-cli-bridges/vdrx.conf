{
  "description": "The OLD way of reaching a program over HTTP: cli_bridges (kept working; each entry is translated into the current cgi / runners / http_routes machinery at startup). New configs should use the examples next to this folder instead. Needs php on PATH. Run vdrx from this folder: http://localhost:8080/cli/index.php  /hello/x  /template-demo?name=Jared  /echo-daemon",

  "settings": { "site_title": "VDRX" },

  "http_sites": [
    { "id": "web", "port": 8080, "template_dir": "templates" }
  ],

  "cli_bridges": [
    { "id": "phpcli", "protocol": "cgi", "prefix": "/cli/", "command": "php", "script_dir": "phpcli", "content_type": "text/html" },
    { "id": "hello-bus-php", "protocol": "bus", "prefix": "/hello", "command": "php hello_bus.php", "content_type": "text/plain" },
    { "id": "template-demo-php", "protocol": "bus", "prefix": "/template-demo", "command": "php template_demo.php", "content_type": "text/html" },
    { "id": "echo-daemon-route", "protocol": "bus-daemon", "prefix": "/echo-daemon", "in_topic": "echo.daemon.in" }
  ],

  "templates": [
    { "id": "admin_templates", "dir": "templates", "subscribe": "template.admin.render" }
  ],

  "processes": [
    { "id": "echo_daemon", "command": "php echo_daemon.php", "subscribe": ["echo.daemon.in"], "publish_allow": ["http.reply.*"], "restart": "always" }
  ]
}
