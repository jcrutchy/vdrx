{
  "description": "A WebSocket server on its own port (8082) and nothing else - no HTTP site at all. A supervised script (ticker.py) publishes a message every second; any WebSocket client allowed by the 'viewer' profile can listen. Run vdrx from this folder, then either open client.html straight from disk or run: python3 watch.py",

  "variables": {
    "PYTHON_BIN_windows": "python",
    "PYTHON_BIN_linux": "python3",
    "PYTHON_BIN": "{PYTHON_BIN_{PLATFORM}}"
  },

  "executives": {
    "ws": { "enabled": true, "port": 8082 }
  },

  "ws_profiles": [
    {
      "id": "viewer",
      "subscribe_allow": ["clock.>"],
      "publish_allow": [],
      "default_subscribe": "clock.>"
    }
  ],

  "processes": [
    {
      "description": "Its stdout lines are republished on the bus. A line that is JSON with a 'topic' goes to that topic - allowed because it matches publish_allow.",
      "id": "ticker",
      "command": "{PYTHON_BIN} ticker.py",
      "restart": "always",
      "publish_allow": ["clock.tick"]
    }
  ]
}
