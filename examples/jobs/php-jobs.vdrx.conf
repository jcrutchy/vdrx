{
  "description": "example job list: PHP scripts run on a schedule",

  "variables": {
    "PHP_BIN_windows": "c:/php/php.exe",
    "PHP_BIN_linux": "/usr/bin/php",
    "PHP_BIN": "{PHP_BIN_{PLATFORM}}",
    "APP_DIR": "{ENV:APP_DIR:-/srv/app}"
  },

  "jobs": [
    { "id": "job1", "command": "{PHP_BIN}", "args": ["{APP_DIR}/job1.php", "arg"], "interval_sec": 360, "enabled": true },
    { "id": "job2", "command": "{PHP_BIN}", "args": ["{APP_DIR}/job2.php", "arg"], "interval_sec": 360, "enabled": true },
    { "id": "job3", "command": "{PHP_BIN}", "args": ["{APP_DIR}/job3.php", "arg"], "interval_sec": 7200, "enabled": true }
  ]
}
