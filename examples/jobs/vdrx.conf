{
  "description": "Scheduled jobs: two programs run on a timer, in parallel, and everything they print appears on the console as '[job:pid] > text' lines - and on a WebSocket for anything that wants to watch (a web terminal, say). Run vdrx from this folder; docs/jobs.md has the whole story. The jobs are one-line shell commands so nothing but a shell is needed.",

  "variables": {
    "SHELL_BIN_windows": "cmd",
    "SHELL_FLAG_windows": "/c",
    "SHELL_BIN_linux": "/bin/sh",
    "SHELL_FLAG_linux": "-c",
    "SHELL_BIN": "{SHELL_BIN_{PLATFORM}}",
    "SHELL_FLAG": "{SHELL_FLAG_{PLATFORM}}"
  },

  "executives": {
    "ws": { "enabled": true, "port": 8082 },
    "jobs": { "state_file": "jobs_state.json", "max_concurrent": 4, "console": true }
  },

  "ws_profiles": [
    {
      "description": "A watcher that may also start and stop jobs: subscribe to job.> and publish jobs.run / jobs.kill / jobs.list.",
      "id": "operator",
      "subscribe_allow": ["job.>", "jobs.>"],
      "publish_allow": ["jobs.run", "jobs.kill", "jobs.list"],
      "default_subscribe": "job.>"
    }
  ],

  "log_file_exclude": ["job.>", "sched.>"],

  "buckets": [
    { "id": "jobs_log", "subscribe": "job.>", "file": "jobs.jsonl", "max_size_mb": 5, "max_files": 3 }
  ],

  "jobs": [
    {
      "id": "heartbeat",
      "command": "{SHELL_BIN}",
      "args": ["{SHELL_FLAG}", "echo heartbeat"],
      "interval_sec": 5
    },
    {
      "description": "Exits non-zero: shows up red as 'failed, exit code 1', and puts a line in the daemon log.",
      "id": "flaky",
      "command": "{SHELL_BIN}",
      "args": ["{SHELL_FLAG}", "echo doing some work && exit 1"],
      "interval_sec": 12,
      "overlap": "skip",
      "timeout_sec": 30
    }
  ]
}
