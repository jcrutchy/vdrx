{
  "description": "An Apache-style PHP web server: ./www is the document root, .php files run through php-cgi, other files are served as-is, a directory serves index.php/index.html, a rewrite gives /blog/42 a pretty URL, and anything that matches no file goes to /index.php (a front controller). Run vdrx from this folder, then browse to http://localhost:8080/",

  "variables": {
    "PHP_CGI_BIN_FILENAME_windows": "c:/php/php-cgi.exe",
    "PHP_CGI_BIN_FILENAME_linux": "php-cgi",
    "PHP_CGI_BIN_FILENAME": "{PHP_CGI_BIN_FILENAME_{PLATFORM}}"
  },

  "http_sites": [
    { "id": "web", "port": 8080 }
  ],

  "rewrites": [
    { "match": "^/blog/([0-9]+)/?$", "to": "/post.php?id=$1" }
  ],

  "cgi": [
    {
      "id": "php",
      "prefix": "/",
      "doc_root": "www",
      "command": "{PHP_CGI_BIN_FILENAME}",
      "extensions": [".php"],
      "index": ["index.php", "index.html"],
      "fallback": "/index.php",
      "timeout_ms": 30000,
      "workers": 4
    }
  ]
}
