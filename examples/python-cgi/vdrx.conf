{
  "description": "A Python CGI web server: ./www is the document root and .py files are run as CGI programs (any interpreter works the same way - only 'command' and 'extensions' change). Run vdrx from this folder, then browse to http://localhost:8080/",

  "variables": {
    "PYTHON_BIN_windows": "python",
    "PYTHON_BIN_linux": "python3",
    "PYTHON_BIN": "{PYTHON_BIN_{PLATFORM}}"
  },

  "http_sites": [
    { "id": "web", "port": 8080 }
  ],

  "cgi": [
    {
      "id": "py",
      "prefix": "/",
      "doc_root": "www",
      "command": "{PYTHON_BIN}",
      "extensions": [".py"],
      "index": ["index.py", "index.html"],
      "timeout_ms": 15000
    }
  ]
}
