{
  "description": "A static web server plus a WebSocket server in one daemon (two ports: HTTP 8080, WebSocket 8082). The page in ./public is a chat room with NO server-side code: browser tabs publish and subscribe to bus topics through the WebSocket, and the bus does the rest. Run vdrx from this folder, open http://localhost:8080/ in two tabs.",

  "http_sites": [
    { "id": "web", "port": 8080, "static_dir": "public" }
  ],

  "executives": {
    "ws": { "enabled": true, "port": 8082 }
  },

  "ws_profiles": [
    {
      "description": "What a browser may do: subscribe to and publish on chat.* only. No token, so any page may use it - add a token before putting this on the internet.",
      "id": "browser",
      "subscribe_allow": ["chat.>"],
      "publish_allow": ["chat.>"]
    }
  ]
}
