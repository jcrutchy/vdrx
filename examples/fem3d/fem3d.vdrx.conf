{
  "variables": {
    "FEM3D_ROOT": "{CONF_DIR}",
    "FEM3D_BIN": "{FEM3D_ROOT}/bin"
  },
  "http_sites": [
    {
      "description": "fem3d web API. cors: true lets a page served from another origin call it from the browser.",
      "id": "fem3dweb",
      "port": 50180,
      "cors": true,
      "tls_port": 0,
      "tls_cert": "",
      "tls_key": "",
      "static_dir": "",
      "template_dir": ""
    }
  ],
  "http_routes": [
    {
      "description": "POST a .fgeo as the request body; the reply is the .prop text. in_topic defaults to femsection.in, which is the topic the femsection runner below listens on.",
      "id": "femsection",
      "prefix": "/fem3d/section",
      "allow": "POST",
      "timeout_ms": 12000
    },
    {
      "description": "Same runner, but the reply comes back as JSON (status, body, exit_code, stderr) - handy for a web page that wants to show errors properly.",
      "id": "femsection_json",
      "prefix": "/fem3d/section.json",
      "in_topic": "femsection.in",
      "allow": "POST",
      "timeout_ms": 12000,
      "response": "json"
    }
  ],
  "runners": [
    {
      "description": "femsection: stdin = the .fgeo, stdout = the .prop. Exit 1 (bad geometry) -> status 422, exit 3 (unparseable input) -> 400. Any bus client can use it too: publish a message to femsection.in with a reply_to.",
      "id": "femsection",
      "command": "{FEM3D_BIN}/femsection{BIN_SUFFIX}",
      "args": ["-"],
      "exit_status": { "1": 422, "3": 400 },
      "timeout_ms": 8000,
      "workers": 2
    }
  ]
}
