{
  "variables": {
    "OPENSSL_DIR_WIN": "C:/dev/openssl",
    "DEV_ROOT_windows": "C:/dev",
    "DEV_ROOT_linux": "/mnt/www",
    "DEV_ROOT": "{DEV_ROOT_{PLATFORM}}",
    "BIN_SUFFIX_windows": ".exe",
    "BIN_SUFFIX_linux": "",
    "BIN_SUFFIX": "{BIN_SUFFIX_{PLATFORM}}"
  },
  "description": "vdrx daemon config",
  "includes": [
    "{DEV_ROOT}/fem3d/fem3d.vdrx.conf"
  ],
  "shutdown_grace_ms": 5000,
  "stdin_admin_enabled": true,
  "tls_ssl_dll": "{OPENSSL_DIR_WIN}/libssl-1_1-x64.dll",
  "tls_crypto_dll": "{OPENSSL_DIR_WIN}/libcrypto-1_1-x64.dll",
  "settings": {
    "site_title": "VDRX"
  },
  "executives": {
    "ws": {
      "description": "websocket server",
      "enabled": true,
      "port": 8082,
      "tls_port": 0,
      "tls_cert": "",
      "tls_key": "",
      "ping_interval_ms": 15000,
      "pong_timeout_ms": 10000,
      "default_subscribe": ""
    }
  },
  "http_sites": [],
  "cli_bridges": []
}
