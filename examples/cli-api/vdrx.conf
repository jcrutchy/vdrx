{
  "description": "Ordinary command-line programs as HTTP APIs. Each program reads the request body on stdin and writes its answer to stdout; vdrx does the HTTP. Needs sort, tr, wc, head and grep on PATH (on Windows swap in your own .exe tools - see docs/guides/cli-api.md). Run vdrx from this folder, then:  curl -d $'pear\\napple\\nfig' http://localhost:8080/api/sort",

  "http_sites": [
    { "id": "web", "port": 8080 }
  ],

  "http_routes": [
    { "id": "sort",       "prefix": "/api/sort",       "allow": "POST" },
    { "id": "upper",      "prefix": "/api/upper",      "allow": "POST" },
    { "id": "words",      "prefix": "/api/words",      "allow": "POST" },
    { "id": "words_json", "prefix": "/api/words.json", "allow": "POST", "in_topic": "words.in", "response": "json" },
    { "id": "head",       "prefix": "/api/head",       "allow": "POST" },
    { "id": "grep",       "prefix": "/api/grep",       "allow": "POST" }
  ],

  "runners": [
    { "id": "sort",  "command": "sort" },
    { "id": "upper", "command": "tr a-z A-Z" },
    { "id": "words", "command": "wc -w" },
    {
      "description": "?n=2 on the URL is filled into %%n%%. The value can't change the command: it's one argument, never parsed by a shell.",
      "id": "head", "command": "head", "args": ["-n", "%%n%%"]
    },
    {
      "description": "grep exits 1 when nothing matched; exit_status turns that into HTTP 404 instead of 500.",
      "id": "grep", "command": "grep", "args": ["-i", "-e", "%%pattern%%"], "exit_status": { "1": 404 }
    }
  ]
}
