{
  "description": "VDRX daemon config. Every section/key VDRX currently reads is present below at least once, explicit values shown even where they equal the built-in default, specifically so this file also serves as the reference - see readme.md for the full narrative walkthrough. 'description' fields anywhere in this file (this one included) are purely documentary: VDRX never reads them, so they're free-form and safe to edit/extend/remove without affecting behaviour. JSON has no comment syntax, which is what these are standing in for. Relative paths (static_dir, script_dir, command, dir, ...) resolve against whatever directory VDRX itself was launched from, not against this file's own location - see 'file paths are relative to VDRX's own cwd' in the readme if something 'not found' unexpectedly.",
  "includes": [
    "C:/dev/kyzu/kyzu.vdrx.conf",
    "C:/dev/hogircd/hogircd.vdrx.conf"
  ],
  "_includes_description": "Array of other config file paths to merge in, each optionally with its own 'includes' (recursive). Paths resolve relative to the file that names them, not to vdrx.conf or the daemon's cwd - so an included app's own config still works regardless of where vdrx.exe is launched from. Array-valued keys (processes/http_sites/cli_bridges/socket_clients/templates/buckets) ACCUMULATE across every included file plus this one; scalar keys (settings.*, shutdown_grace_ms, ...) are last-write-wins in include order, with THIS file's own values always winning over anything an include sets. Lets an application's own executive definitions live and get version-controlled in that application's own repo - e.g. \"includes\": [\"../kyzu/kyzu.vdrx.conf\"]. Empty here; kept as its own explicit key anyway per this file's own 'show every applicable key' rule, even though an empty array is also what omitting it entirely defaults to.",
  "variables": {
    "VDRX_DIR": "c:/dev/vdrx",
    "PHP_DIR": "c:/php",
    "PHP_BIN_FILENAME": "{PHP_DIR}/php",
    "PHP_CGI_BIN_FILENAME": "{PHP_DIR}/php-cgi{EXE_EXT}",
    "OPENSSL_DIR": "C:/dev/openssl"
  },
  "_variables_description": "User-declared variables, usable as {NAME} in any string KEY or VALUE anywhere in this file and in every file it (recursively) includes - including inside include paths and inside other variables' names and values (e.g. PHP_BIN_FILENAME above uses PHP_DIR). Circular references (A uses B uses A) are an error: at startup the daemon refuses to run, and on 'reload' the existing config is kept and the problems are logged. Values may be strings, numbers or booleans. A variable declared here overrides one of the same name declared in an included file, so an included application conf can ship a default and this file can override it. Names: letters, digits, '_', '.', '-', starting with a letter or '_'; case-sensitive. RESERVED/AUTOMATIC variables (cannot be redeclared): {PLATFORM} (windows|linux|...), {ARCHITECTURE} (x86_64|i386|aarch64|...), {PATH_SEPARATOR} (\\ or /), {PATH_LIST_SEPARATOR} (; or :), {EXE_EXT} (.exe or empty), {VDRX_ROOT_PATH} (directory containing the vdrx executable), {VDRX_BIN_FILENAME}, {VDRX_BIN_PATH}, {APP_ROOT_PATH}/{APP_BIN_FILENAME}/{APP_BIN_PATH} (generic aliases of the three before), {MAIN_CONF_DIR} (directory of this top-level file), {CONF_DIR} and {CONF_FILE} (directory/name of whichever file the reference is written in - so an included file's {CONF_DIR} is its own directory), {LBRACE} and {RBRACE} (a literal { and }). Environment variables: {ENV:NAME} (error if unset), or {ENV:NAME:-fallback}. References nest: {VAR_{WHICH}}. Text in braces that isn't shaped like a reference (e.g. {status,body} or JSON) is left alone; a reference-shaped {typo} that names nothing is an error, so write {LBRACE}print{RBRACE} if you need a literal {print}. Every 'description'/'*_description' key is never expanded, so documentation can mention {PHP_BIN_FILENAME} freely. The resolved variables are also readable as config values under variables.NAME. Numeric/boolean settings can use a variable too, as a string: \"port\": \"{WEB_PORT}\".",
  "log_max_payload_bytes": 4096,
  "_log_max_payload_bytes_description": "How many bytes of each bus message payload the logger writes before clipping it (default 4096).",
  "http_read_timeout_ms": 10000,
  "_http_read_timeout_ms_description": "Longest an HTTP client may stay silent between two reads (default 10000). 0 = no limit.",
  "http_request_timeout_ms": 30000,
  "_http_request_timeout_ms_description": "Longest an HTTP client may take to send a whole request, headers and body (default 30000). 0 = no limit.",
  "log_redact": true,
  "_log_redact_description": "Mask credentials (Authorization/Cookie/token/password/api_key members, token= and password= style parameters, Bearer/Basic values) in everything the logger writes. Default true; false prints a startup warning.",
  "log_redact_bodies": true,
  "_log_redact_bodies_description": "Also replace the body of HTTP request/reply envelopes with [body redacted] (default true). Only relevant while log_redact is true.",
  "shutdown_grace_ms": 5000,
  "_shutdown_grace_ms_description": "Default grace period (ms) any supervised process or socket connection gets to exit cleanly (SIGTERM on Unix, best-effort stdin-close hint on Windows - see vdrx_procutil.pas) before VDRX force-kills it. Applies on 'quit'/sys.quit/sys.restart AND on Ctrl+C/SIGINT/SIGTERM now (vdrx_procutil.pas's InstallShutdownSignalHandler) - all three drive the identical clean-shutdown path. Override per entry with that entry's own 'graceful_timeout_ms'.",
  "log_console_exclude": [],
  "log_file_exclude": [],
  "_log_exclude_description": "Arrays of topic filters ('*' = one segment, '>' = the rest). Matching messages are NOT printed to the console (log_console_exclude) / NOT written to vdrx_daemon.log (log_file_exclude); everything else is logged as before. Typical: [\"job.>\", \"sched.>\"] so job output (docs/jobs.md) lives in a rotating bucket instead of the daemon log. With executives.jobs.console on, job.> and sched.> are kept off the console automatically.",
  "stdin_admin_enabled": true,
  "_stdin_admin_enabled_description": "Whether the console accepts typed admin commands (quit / restart / reload / kill <pid-or-id> / killall [type] / list / history). Set false for a background/service deployment with no attached interactive console - Ctrl+C/SIGTERM still work either way, this only controls the typed-command surface.",
  "tls_ssl_dll": "{OPENSSL_DIR}/libssl-1_1-x64.dll",
  "tls_crypto_dll": "{OPENSSL_DIR}/libcrypto-1_1-x64.dll",
  "_tls_dll_description": "Windows-only. FPC's openssl unit dlopen()s OpenSSL by its unversioned name at runtime; on a system without that symlink (most Windows installs), point these at specific DLLs - e.g. \"C:/dev/openssl/libssl-3-x64.dll\" / \"C:/dev/openssl/libcrypto-3-x64.dll\". Leave both blank (the default) to rely on the system's own OpenSSL discovery, which works out of the box on most Linux distros once libssl-dev (or equivalent) is installed. Only matters if anything here actually uses TLS (an http_sites/executives.ws tls_port, or a socket_clients entry with \"tls\": true).",
  "settings": {
    "site_title": "VDRX"
  },
  "_settings_description": "Arbitrary key/value pairs, available in any .tpl template as $$key$$ (see vdrx_templates.pas). Deliberately NOT given an inline 'description' key the way other sections are - unlike every other section, settings.* is exposed WHOLESALE to templates by name, so an inline description key would itself become accessible as $$description$$ in every template. Not read anywhere else - add whatever a template set actually uses; this section can be empty.",
  "executives": {
    "jobs": {
      "description": "Settings shared by every entry in the top-level jobs array (docs/jobs.md, section 11).",
      "state_file": "jobs_state.json",
      "max_concurrent": 0,
      "console": true,
      "console_color": true,
      "_description": "state_file: remembers when each scheduled job last ticked so a restart doesn't re-run everything ('' = don't remember). max_concurrent: jobs allowed to run at once, 0 = no limit; extra ticks wait in a FIFO queue. console: print job.> as coloured '[job:pid] > text' lines (and keep job.> and sched.> off the logger's console so they aren't doubled). console_color: ANSI colours in that output - turn off under journald."
    },
    "ws": {
      "description": "The single JSON-RPC-over-WebSocket bridge (readme \u00a75) - one instance total, unlike http_sites/socket_clients/processes which are arrays. A connection is internally two cooperating executives (TVDRX_WSConnection for framing/keepalive, TVDRX_WSProtocolExecutive for sys.auth/subscribe/unsubscribe/publish interpretation) but that's an implementation detail, not something this config exposes separately.",
      "enabled": true,
      "port": 8082,
      "bind": "127.0.0.1",
      "max_connections": 256,
      "allow_open_access": false,
      "allowed_origins": [],
      "max_frame_bytes": 1048576,
      "frame_timeout_ms": 15000,
      "tls_port": 0,
      "tls_cert": "",
      "tls_key": "",
      "ping_interval_ms": 15000,
      "pong_timeout_ms": 10000,
      "default_subscribe": ""
    }
  },
  "_executives_description": "Wrapper object for singleton (exactly-one) executives - currently only 'ws'. enabled: false is the default (WS off unless turned on). tls_port: 0 means TLS disabled for this listener; a nonzero value also needs tls_cert+tls_key, and additionally needs tls_ssl_dll/tls_crypto_dll above on Windows if the system OpenSSL isn't auto-discoverable. ping_interval_ms/pong_timeout_ms: keepalive - a connection that hasn't ponged within pong_timeout_ms of the last ping is considered dead and torn down. default_subscribe: comma-joined topic filter(s) every NEW connection is registered on automatically (in addition to its own reply channel), before any client-side 'subscribe' RPC - e.g. a server-wide announcements topic every browser should see without asking. Empty string (the default) means connections start with no filters beyond what they explicitly subscribe to themselves.",
  "http_sites": [
    {
      "description": "VDRX's own admin/demo site - static files, the cgi/bus/bus-daemon cli_bridges examples below, and the 'admin_templates' template executive's dir all live under this site's own static_dir/template_dir.",
      "id": "vdrx_admin",
      "port": 9080,
      "bind": "127.0.0.1",
      "max_connections": 256,
      "websocket_path": "",
      "tls_port": 0,
      "tls_cert": "",
      "tls_key": "",
      "static_dir": "static",
      "template_dir": "{VDRX_DIR}/examples/legacy-cli-bridges/templates"
    }
  ],
  "_http_sites_description": "Array - one independent HTTP listener per entry, each with its own port, own TLS config, own static_dir/template_dir. id is required and must be unique (TVDRX_HTTPExecutive.ApplyConfig re-finds its own row by id on every 'sys.reload' - see vdrx_network.pas). port defaults to 8081 if omitted (fine for one site; give every site its own explicit port once there's more than one, as below). tls_port: 0 disables TLS for this site. static_dir/template_dir default to 'static'/'templates' (relative to VDRX's cwd) if omitted. cli_bridges/processes-with-prefix routes are matched globally across every site that shares this array (see readme \u00a74's note on that), not scoped per-site.",
  "ws_profiles": [
    {
      "description": "What a WebSocket client may do, chosen by its sys.auth (readme 5a). The profile tools/conf_viewer.html uses for live mode: it can only watch these topics, and its one publish right is asking the confserver runner (below) for config files.",
      "id": "viewer",
      "enabled": false,
      "token": "change-me",
      "subscribe_allow": ["http.reply.*", "echo.>", "hello.>", "viewer.reply.*"],
      "publish_allow": ["confserver.in"],
      "default_subscribe": "",
      "max_queue": 2000
    }
  ],
  "_ws_profiles_description": "Array. With no ws_profiles any non-empty sys.auth token may subscribe to and publish anything (sys.* included). With profiles: a token (or a named profile) selects one; subscribe filters must be covered by subscribe_allow, publishes must match publish_allow (deny-by-default), default_subscribe is applied after auth, max_queue bounds the frames kept for a slow client (oldest dropped). A profile with no token is open to anyone who names it. While profiles exist, executives.ws.default_subscribe is ignored.",
  "runners": [
    {
      "description": "Serves config files to tools/conf_viewer.html over the bus (viewer: 'Open via bus…' / 'Load includes'). The script only reads .conf/.json files under the roots listed at the top of tools/confserver.php - edit that list. Needs the 'viewer' ws_profile below to be enabled.",
      "id": "confserver",
      "command": "{PHP_BIN_FILENAME} {VDRX_DIR}/tools/confserver.php",
      "args": ["%%file%%"],
      "exit_status": { "1": 404, "2": 403 },
      "content_type": "application/json"
    }
  ],
  "rewrites": [],
  "_rewrites_description": "Array of {match, to, flag}. match is a regular expression tested against the request path (no query); to is the replacement target ($1, $2 are regex groups; a '?x=$1' part REPLACES the query string, otherwise the client's is kept); flag: 'last' (default, first match wins) | 'continue' | 'redirect' (302) | 'permanent' (301). Applied before any routing, so it affects proxy, cgi and http_routes alike; the CGI program still sees the client's original URI as REQUEST_URI. Example: {\"match\": \"^/blog/([0-9]+)/?$\", \"to\": \"/post.php?id=$1\"}.",
  "cgi": [
    {
      "description": "A CGI adaptor + the route feeding it - php-cgi as an ordinary consumer of bus messages. Serves doc_root like a web server: existing .php runs (anything after it is PATH_INFO), other existing files are served static, a directory gets index.php/index.html, and everything else goes to the fallback front controller. enabled is false here so the example does nothing until you point doc_root at a real site.",
      "id": "php",
      "enabled": false,
      "prefix": "/app/",
      "doc_root": "C:/www/app",
      "command": "{PHP_CGI_BIN_FILENAME}",
      "args": ["%%script%%"],
      "extensions": [".php"],
      "index": ["index.php", "index.html"],
      "fallback": "/index.php",
      "static": true,
      "env": { "APP_ENV": "dev" },
      "timeout_ms": 30000,
      "workers": 4
    }
  ],
  "_cgi_description": "Array - each entry is a TVDRX_CGIExecutive (vdrx_cgi.pas) plus its HTTP route. id, prefix and doc_root are required. command: the program to run ('' = run the script file itself, classic cgi-bin); args: '%%script%%' is replaced by the absolute script filename (default [\"%%script%%\"], so command 'php-cgi' runs 'php-cgi /path/index.php'); the program gets the full RFC 3875 environment (REQUEST_METHOD, QUERY_STRING, SCRIPT_NAME, SCRIPT_FILENAME, PATH_INFO, REMOTE_ADDR, SERVER_NAME/PORT, HTTPS, HTTP_* ...), the request body on stdin, and runs in the script's own directory. Its stdout is parsed as a CGI response (Status:/Content-Type:/Location:/Set-Cookie: headers, blank line, body) - or set output 'raw' to treat stdout as the body. extensions default ['.php'] ('.cgi' when command is ''). Also: allow (methods, default any), work_dir, content_type, max_queue, in_topic. Not scoped per http_sites entry (same global-table caveat as cli_bridges). A prefix of '/' takes the whole site, including static files, ahead of the site's static_dir.",
  "cli_bridges": [
    {
      "description": "protocol 'cgi' (the default - shown explicit here) example. script_dir 'phpcli' is where VDRX resolves the URL path beyond 'prefix' to an actual .php file (GET /cli/index.php -> phpcli/index.php), run via plain 'php' (not php-cgi, so $_GET/$_SERVER are NOT auto-populated inside the script - it reads getenv() directly instead, see phpcli/index.php).",
      "id": "phpcli",
      "protocol": "cgi",
      "prefix": "/cli/",
      "command": "{PHP_BIN_FILENAME}",
      "script_dir": "{VDRX_DIR}/examples/legacy-cli-bridges/phpcli",
      "timeout_ms": 5000,
      "content_type": "text/html"
    },
    {
      "description": "protocol 'bus', spawn-per-request (readme \u00a74b). command is the FULL command line for one fixed script handling everything under prefix - no per-path file lookup. Reads one JSON request line off stdin ({method,path,prefix,sub_path,query,headers,body}), writes one JSON reply line to stdout ({status,body} or {status,template,params,rows}). script_dir left blank here - falls back to VDRX's own cwd as the process's working directory.",
      "id": "hello-bus-php",
      "protocol": "bus",
      "prefix": "/hello",
      "command": "{PHP_BIN_FILENAME} {VDRX_DIR}/examples/legacy-cli-bridges/hello_bus.php",
      "script_dir": "",
      "timeout_ms": 5000,
      "content_type": "text/plain"
    },
    {
      "description": "Same 'bus' protocol as above, but its reply uses the OTHER shape - {template,template_topic,params,rows} instead of a raw body - routing rendering through the 'admin_templates' executive below by explicit topic name rather than implicitly using whichever site answered this connection (see readme \u00a74d - this is the fix for a real site-ambiguity bug this exact route used to hit when reachable on more than one site's port).",
      "id": "template-demo-php",
      "protocol": "bus",
      "prefix": "/template-demo",
      "command": "{PHP_BIN_FILENAME} {VDRX_DIR}/examples/legacy-cli-bridges/template_demo.php",
      "script_dir": "",
      "timeout_ms": 5000,
      "content_type": "text/html"
    },
    {
      "description": "Same 'bus' protocol, deliberately answered by a Windows batch file instead of PHP - proves the request/reply contract is genuinely language-agnostic, not PHP-specific. command routes through cmd.exe since Windows doesn't execute .bat files as a bare process image the way it does a real .exe.",
      "id": "hello-bus-bat",
      "protocol": "bus",
      "prefix": "/hello-bat",
      "command": "cmd /c scripts\\hello_bus.bat",
      "script_dir": "",
      "timeout_ms": 5000,
      "content_type": "text/plain"
    },
    {
      "description": "protocol 'bus-daemon' (readme \u00a74c) - the persistent-subscriber counterpart to 'bus' above. Nothing is spawned per request: the same JSON envelope is published to in_topic (with a freshly-minted reply_to added) and this just waits up to timeout_ms for a reply there. Answered by the 'echo_daemon' processes entry below, which stays running and shares across every concurrent request instead of paying spawn cost each time. command/script_dir are unused for this protocol.",
      "id": "echo-daemon-route",
      "protocol": "bus-daemon",
      "prefix": "/echo-daemon",
      "in_topic": "echo.daemon.in",
      "timeout_ms": 5000,
      "content_type": "text/plain"
    }
  ],
  "_cli_bridges_description": "Array, GLOBAL across every http_sites entry (matched by longest-prefix-wins, same table regardless of which site's port the request arrived on - see readme \u00a74's note on why that matters for template rendering specifically). id and prefix are always required. protocol: 'cgi' (default) | 'bus' | 'bus-daemon' - see each example above; 'cgi' also needs script_dir, 'bus'/'bus-daemon' don't. command is required for 'cgi'/'bus', unused for 'bus-daemon'. in_topic (bus-daemon only) defaults to '<id>.in' if omitted. timeout_ms defaults to 5000. content_type defaults to 'text/html'.",
  "templates": [
    {
      "description": "Gives VDRX's own template engine (vdrx_templates.pas - $$setting$$/??const??/%%var%%/##loop##/@@child@@) a bus identity independent of any http_sites entry's own template_dir - see readme \u00a74d. Anything (a bus-CLI reply's template_topic, a persistent daemon, anything) can publish a render request to 'template.admin.render' and get back {\"body\":\"...\"} on whatever reply_to it supplied, regardless of which HTTP site (if any) is involved.",
      "id": "admin_templates",
      "dir": "{VDRX_DIR}/examples/legacy-cli-bridges/templates",
      "subscribe": "template.admin.render"
    }
  ],
  "_templates_description": "Array. id and dir are required. subscribe defaults to '<id>.in' if omitted (same fallback convention as processes/socket_clients/cli_bridges' in_topic - see each of their notes). One TVDRX_TemplateStore per entry, completely independent of http_sites' own template_dir fields - can point at the same directory (as here) or a different one entirely.",
  "processes": [
    {
      "description": "Persistent bus-daemon subscriber answering the 'echo-daemon-route' cli_bridges entry above (readme \u00a74c) - proves a 'processes' entry can double as an HTTP backend with zero spawn-per-request cost, sharing one running process across every concurrent request. publish uses a wildcard pattern (a Bridge structured-publish allow-list, not a fixed single target - every request gets its OWN freshly-minted reply_to, e.g. http.reply.42) rather than the fixed '<id>.out' shape subscribe/publish otherwise defaults to.",
      "id": "echo_daemon",
      "command": "{PHP_BIN_FILENAME} {VDRX_DIR}/examples/legacy-cli-bridges/echo_daemon.php",
      "restart": "always",
      "graceful_timeout_ms": 5000,
      "subscribe": [
        "echo.daemon.in"
      ],
      "publish": [
        "http.reply.*"
      ],
      "prefix": "",
      "host": "",
      "port": "",
      "enabled": false
    }
  ],
  "_processes_description": "Array - every entry gets a supervised TVDRX_BridgeExecutive (spawn, restart-on-crash per 'restart' policy, graceful-then-forced shutdown). id and command are the only two truly required fields; everything else shown explicit above is that field's default. restart: 'always' (default) | 'on-failure' | 'never'. graceful_timeout_ms falls back to the top-level shutdown_grace_ms if omitted. subscribe defaults to '<id>.in' if omitted/blank (a literal topic, not a wildcard). publish defaults to nothing beyond the always-available '<id>.out' fallback for plain stdout lines - give it a pattern list to let the process's stdout choose its OWN target topic instead (a JSON line {\"topic\":...,\"payload\":...} matching one of these patterns), as echo_daemon does. prefix/host/port (all optional, all blank by default): give prefix and this ALSO gets an HTTP reverse-proxy route - for an app that already speaks HTTP itself (php -S, a Node dev server) rather than one you want driven purely over the bus; host defaults to 127.0.0.1 if prefix is given but host isn't. enabled defaults to true.",
  "socket_clients": [],
  "_socket_clients_description": "Array - every entry gets a TVDRX_SocketClientExecutive (outbound dialer, auto-reconnecting by default). id/host/port are required. tls defaults to false. tls_verify defaults to TRUE (verify the peer certificate) - only set false to skip verification, e.g. while diagnosing whether a connection problem is TLS-handshake-related versus protocol-level (see readme's IRC TLS gotcha note); tls_ca_file/tls_peer_name are both optional (peer_name falls back to host for SNI if blank). framing: 'delimiter' (default, split on line feed - matches Bridge's own #13/#10 handling) | 'chunk' (fixed-size reads, chunk_size default 4096); delimiter (write-side terminator only) defaults to CRLF. reconnect: 'auto' (default, backoff via reconnect_delay_ms up to max_reconnect_delay_ms) | 'none' (dial once, stay down on disconnect). graceful_timeout_ms falls back to shutdown_grace_ms if omitted. subscribe defaults to '<id>.in' if omitted. publish defaults to '<id>.out' if omitted/blank - unlike processes' publish (an allow-list of patterns), this is a single fixed target topic, since a socket_client always emits one continuous stream, never a multiplexed handful of different topics the way a Bridge-managed process's structured stdout can. enabled defaults to true.",
  "jobs": [
    {
      "id": "example_job",
      "command": "{PHP_BIN_FILENAME}",
      "args": ["{MAIN_CONF_DIR}/scripts/report.php", "--daily"],
      "work_dir": "{MAIN_CONF_DIR}",
      "env": { "REPORT_MODE": "batch" },
      "interval_sec": 3600,
      "enabled": false,
      "run_on_start": true,
      "overlap": "skip",
      "timeout_sec": 0,
      "kill_grace_ms": 3000,
      "strip_ansi": true
    }
  ],
  "_jobs_description": "Array (docs/jobs.md, section 11) - every entry is a program run on a timer, several at once, with its stdout/stderr published line by line as job.<id>.out / job.<id>.err plus job.<id>.start / .exit / .skip / .queued (a JSON payload each). id (letters, digits, _ and - only; it is a topic segment) and command are required; everything shown is that field's default except enabled (shown false here so this reference file starts no job). command is split on spaces; args is passed exactly as written (prefer it for paths with spaces). interval_sec 0/omitted = never scheduled, only jobs.run / sched.<id> start it ('interval' is accepted as an alias). enabled=false only stops the SCHEDULING - a disabled job can still be run by hand. overlap = what a tick does while the previous run is still going: 'skip' (default) | 'queue' (run once more afterwards, at most one remembered) | 'kill' (stop the old run, start a new one). timeout_sec 0 = no limit. A stop is polite first (SIGTERM; nothing polite exists on Windows) and forced after kill_grace_ms. Control topics: jobs.run, jobs.kill (payload: the job id or {\"job\":\"id\"}), jobs.list (answered on jobs.state). Read at startup; 'reload' does not re-read this array.",
  "buckets": [],
  "_buckets_description": "Array. name and topics are required (name, not id - the one section that differs from everywhere else in this file). file defaults to 'bucket_<name>.jsonl' (relative to VDRX's cwd) if omitted."
}
