{
  "description": "A minimal Apache2-style PHP web server: serve a document root, run .php through php-cgi, static files as-is, index.php/index.html for directories, and a front controller for pretty URLs. Edit the variables, run vdrx, browse to http://localhost:8080/",

  "variables": {
    "PHP_DIR": "c:/php",
    "PHP_CGI_BIN_FILENAME": "{PHP_DIR}/php-cgi{EXE_EXT}",
    "DOC_ROOT": "c:/www",
    "HTTP_PORT": "8080"
  },

  "http_sites": [
    {
      "id": "web",
      "port": "{HTTP_PORT}",
      "static_dir": "static"
    }
  ],

  "rewrites": [],

  "cgi": [
    {
      "id": "php",
      "prefix": "/",
      "doc_root": "{DOC_ROOT}",
      "command": "{PHP_CGI_BIN_FILENAME}",
      "extensions": [".php"],
      "index": ["index.php", "index.html"],
      "fallback": "/index.php",
      "timeout_ms": 30000,
      "workers": 8
    }
  ]
}
