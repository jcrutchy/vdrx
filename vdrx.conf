  "_socket_clients_description": "Array - every entry gets a TVDRX_SocketClientExecutive (outbound dialer, auto-reconnecting by default). id/host/port are required. tls defaults to false. tls_verify defaults to TRUE (verify the peer certificate) - only set false to skip verification, e.g. while diagnosing whether a connection problem is TLS-handshake-related versus protocol-level (see readme's IRC TLS gotcha note); tls_ca_file/tls_peer_name are both optional (peer_name falls back to host for SNI if blank). framing: 'delimiter' (default, split on line feed - matches Bridge's own #13/#10 handling) | 'chunk' (fixed-size reads, chunk_size default 4096); delimiter (write-side terminator only) defaults to CRLF. reconnect: 'auto' (default, backoff via reconnect_delay_ms up to max_reconnect_delay_ms) | 'none' (dial once, stay down on disconnect). graceful_timeout_ms falls back to shutdown_grace_ms if omitted. subscribe defaults to '<id>.in' if omitted. publish defaults to '<id>.out' if omitted/blank - unlike processes' publish (an allow-list of patterns), this is a single fixed target topic, since a socket_client always emits one continuous stream, never a multiplexed handful of different topics the way a Bridge-managed process's structured stdout can. enabled defaults to true.",
