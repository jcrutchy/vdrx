{
  "shutdown_grace_ms": 5000,
  "stdin_admin_enabled": true,
  "tls_ssl_dll": "C:/dev/openssl/libssl-1_1-x64.dll",
  "tls_crypto_dll": "C:/dev/openssl/libcrypto-1_1-x64.dll",
  "settings": {
    "site_title": "VDRX"
  },
  "processes": [
    {
      "id": "hogircd",
      "command": "C:/dev/hogircd/hogircd.exe",
      "restart": "always",
      "graceful_timeout_ms": 500,
      "enabled": false
    },
    {
      "id": "kyzu_game",
      "command": "C:/dev/kyzu/kyzu.exe",
      "restart": "always",
      "subscribe": "game.cmd.>",
      "publish": "game.tick,game.event.>",
      "enabled": false
    },
    {
      "id": "irc_soylent_bot",
      "command": "c:/php/php C:/dev/vdrx/scripts/irc_soylent.php --nick=vdrxbot --user=vdrx --channel=#test",
      "restart": "always",
      "subscribe": ["soylent.out"],
      "publish": ["soylent.in"]
    }
  ],
  "http_sites": [
    {
      "id": "vdrx_admin",
      "port": 8081,
      "static_dir": "static",
      "template_dir": "templates"
    },
    {
      "id": "kyzu",
      "port": 8090,
      "static_dir": "C:/dev/kyzu/web/static",
      "template_dir": "C:/dev/kyzu/web/templates"
    },
    {
      "id": "kyzu_map",
      "port": 8091,
      "static_dir": "C:/dev/kyzu/web/map/static",
      "template_dir": "C:/dev/kyzu/web/map/templates"
    },
    {
      "id": "kyzu_data",
      "port": 8092,
      "static_dir": "C:/dev/kyzu_data/public",
      "template_dir": ""
    }
  ],
  "cli_bridges": [
    {
      "id": "phpcli",
      "prefix": "/cli/",
      "command": "c:/php/php",
      "script_dir": "phpcli",
      "timeout_ms": 5000,
      "content_type": "text/html"
    }
  ],
  "socket_clients": [
    {
      "id": "soylent",
      "host": "irc.soylentnews.org",
      "port": "6697",
      "enabled": true,
      "tls": "true",
      "tls_verify": "true",
      "tls_ca_file": "C:/dev/crt/hexchat_cert.pem",
      "subscribe": ["soylent.in"]
    }
  ],
  "executives": {
    "ws": {
      "enabled": true,
      "port": 8082,
      "ping_interval_ms": 15000,
      "pong_timeout_ms": 10000,
      "tls_port": 0,
      "tls_cert": "",
      "tls_key": ""
    }
  }
}
