{
  "shutdown_grace_ms": 5000,
  "stdin_admin_enabled": true,
  "tls_ssl_dll": "C:/dev/openssl/libssl-1_1-x64.dll",
  "tls_crypto_dll": "C:/dev/openssl/libcrypto-1_1-x64.dll",
  "settings": {
    "site_title": "VDRX"
  },
  "processes": [
    {
      "id": "hogircd",
      "command": "C:/dev/hogircd/hogircd.exe",
      "restart": "always",
      "graceful_timeout_ms": 500,
      "enabled": false
    },
    {
      "id": "kyzu_game",
      "command": "C:/dev/kyzu/kyzu.exe",
      "restart": "always",
      "subscribe": "game.cmd.>",
      "publish": "game.tick,game.event.>",
      "enabled": false
    },
    {
      "id": "irc_bot",
      "command": "c:/php/php C:/dev/vdrx/scripts/irc_client.php --nick=vdrxbot --user=vdrx --channel=#vdrx",
      "restart": "always",
      "subscribe": ["freenode.out"],
      "publish": ["irc_bot.in"],
      "enabled": false
    },
    {
      "id": "echo_daemon",
      "command": "c:/php/php scripts/echo_daemon.php",
      "restart": "always",
      "subscribe": ["echo.daemon.in"],
      "publish": ["http.reply.*"],
      "enabled": true
    }
  ],
  "http_sites": [
    {
      "id": "vdrx_admin",
      "port": 8081,
      "static_dir": "static",
      "template_dir": "templates"
    },
    {
      "id": "kyzu",
      "port": 8090,
      "static_dir": "C:/dev/kyzu/web/static",
      "template_dir": "C:/dev/kyzu/web/templates"
    },
    {
      "id": "kyzu_map",
      "port": 8091,
      "static_dir": "C:/dev/kyzu/web/map/static",
      "template_dir": "C:/dev/kyzu/web/map/templates"
    },
    {
      "id": "kyzu_data",
      "port": 8092,
      "static_dir": "C:/dev/kyzu_data/public",
      "template_dir": ""
    }
  ],
  "cli_bridges": [
    {
      "id": "phpcli",
      "prefix": "/cli/",
      "command": "c:/php/php",
      "script_dir": "phpcli",
      "timeout_ms": 5000,
      "content_type": "text/html"
    },
    {
      "id": "hello-bus-php",
      "prefix": "/hello",
      "protocol": "bus",
      "command": "c:/php/php scripts/hello_bus.php",
      "timeout_ms": 5000,
      "content_type": "text/plain"
    },
    {
      "id": "template-demo-php",
      "prefix": "/template-demo",
      "protocol": "bus",
      "command": "c:/php/php scripts/template_demo.php",
      "timeout_ms": 5000,
      "content_type": "text/html"
    },
    {
      "id": "hello-bus-bat",
      "prefix": "/hello-bat",
      "protocol": "bus",
      "command": "cmd /c scripts\\hello_bus.bat",
      "timeout_ms": 5000,
      "content_type": "text/plain"
    },
    {
      "id": "echo-daemon-route",
      "prefix": "/echo-daemon",
      "protocol": "bus-daemon",
      "in_topic": "echo.daemon.in",
      "timeout_ms": 5000,
      "content_type": "text/plain"
    }
  ],
  "socket_clients": [
    {
      "id": "soylent",
      "host": "irc.soylentnews.org",
      "port": "6697",
      "enabled": false,
      "tls": "true",
      "tls_verify": "true",
      "tls_ca_file": "C:/dev/crt/hexchat_cert.pem",
      "subscribe": ["irc_bot.in"]
    },
    {
      "id": "freenode",
      "host": "irc.libera.chat",
      "port": "6697",
      "enabled": false,
      "tls": "true",
      "tls_verify": "true",
      "tls_ca_file": "C:/dev/crt/hexchat_cert.pem",
      "subscribe": ["irc_bot.in"]
    }
  ],
  "executives": {
    "ws": {
      "enabled": true,
      "port": 8082,
      "ping_interval_ms": 15000,
      "pong_timeout_ms": 10000,
      "tls_port": 0,
      "tls_cert": "",
      "tls_key": ""
    }
  },
  "templates": [
    {
      "id": "admin_templates",
      "dir": "templates",
      "subscribe": "template.admin.render"
    }
  ]
}
