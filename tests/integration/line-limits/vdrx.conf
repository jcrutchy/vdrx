{
  "description": "Fixture for line_limits_test.py: max_line_bytes on a socket client and on a supervised process, with a tiny limit so the test runs in seconds",
  "stdin_admin_enabled": false,
  "variables": { "PYTHON_BIN_windows": "python", "PYTHON_BIN_linux": "python3", "PYTHON_BIN": "{PYTHON_BIN_{PLATFORM}}" },
  "executives": { "ws": { "enabled": true, "port": 18084 } },
  "ws_profiles": [ { "id": "viewer", "token": "vt", "subscribe_allow": ["demo.>"] } ],
  "buckets": [ { "id": "sink", "subscribe": "limsock.out,limproc.out", "file": "bucket.jsonl" } ],
  "socket_clients": [
    { "id": "limsock", "host": "127.0.0.1", "port": "18701", "max_line_bytes": "2048", "reconnect_delay_ms": "300", "max_reconnect_delay_ms": "1000" }
  ],
  "processes": [
    { "id": "limproc", "command": "{PYTHON_BIN} big_out.py", "restart": "never", "max_line_bytes": "2048" }
  ]
}
