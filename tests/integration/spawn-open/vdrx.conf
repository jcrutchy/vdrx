{
  "description": "Same site as ../spawn with the opt-outs on: one named variable passed through, symlinks followed, .php allowed, .txt denied",
  "stdin_admin_enabled": false,
  "max_child_output_bytes": 1000000,
  "child_env_passthrough": ["VDRX_TEST_SECRET"],
  "static_follow_symlinks": true,
  "static_allow_extensions": ["php"],
  "static_deny_extensions": ["txt"],
  "variables": { "PYTHON_BIN_windows": "python", "PYTHON_BIN_linux": "python3", "PYTHON_BIN": "{PYTHON_BIN_{PLATFORM}}" },
  "http_sites": [ { "id": "web", "port": 18080, "static_dir": "../spawn/static" } ],
  "cgi": [ { "id": "py", "prefix": "/cgi/", "doc_root": "../spawn/www", "command": "{PYTHON_BIN}", "args": ["%%script%%"], "extensions": [".py"], "timeout_ms": 2000 } ]
}
