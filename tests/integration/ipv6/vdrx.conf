{
  "description": "Fixture for ipv6_test.py: IPv6 and dual-stack listeners next to an IPv4 control. The sites that need IPv6 only come up on hosts that have it.",
  "stdin_admin_enabled": false,
  "http_read_timeout_ms": 1500,
  "http_request_timeout_ms": 3000,
  "http_sites": [
    { "id": "v4",     "port": 18103, "static_dir": "www" },
    { "id": "bad1",   "port": 18104, "static_dir": "www", "bind": "::zz" },
    { "id": "bad2",   "port": 18105, "static_dir": "www", "bind": "::ffff:1.2.3.4" },
    { "id": "loop6",  "port": 18106, "static_dir": "www", "bind": "::1" },
    { "id": "dual",   "port": 18107, "static_dir": "www", "bind": "::", "max_connections_per_ip": 2, "connection_rate_per_ip": 0 },
    { "id": "dualx",  "port": 18109, "static_dir": "www", "bind": "::", "max_connections_per_ip": 1, "connection_rate_per_ip": 0, "limit_exempt": "127.0.0.1, ::1" }
  ],
  "processes": [
    { "id": "upstream", "command": "python3 upstream.py 18108", "prefix": "/app/", "host": "127.0.0.1", "port": 18108 }
  ]
}
