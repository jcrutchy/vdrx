{
  "description": "Fixture for spawn_test.py: CGI under /cgi/, a static site with files that must not be served, small output cap and short timeout",
  "stdin_admin_enabled": false,
  "max_child_output_bytes": 1000000,
  "variables": { "PYTHON_BIN_windows": "python", "PYTHON_BIN_linux": "python3", "PYTHON_BIN": "{PYTHON_BIN_{PLATFORM}}" },
  "http_sites": [ { "id": "web", "port": 18080, "static_dir": "static" } ],
  "cgi": [ { "id": "py", "prefix": "/cgi/", "doc_root": "www", "command": "{PYTHON_BIN}", "args": ["%%script%%"], "extensions": [".py"], "timeout_ms": 2000 } ]
}
