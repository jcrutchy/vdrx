{
  "description": "Same as log-redaction but log_redact is OFF: the probe's secrets MUST show up (proves the test can see them)",
  "stdin_admin_enabled": false,
  "log_redact": false,
  "variables": { "PYTHON_BIN_windows": "python", "PYTHON_BIN_linux": "python3", "PYTHON_BIN": "{PYTHON_BIN_{PLATFORM}}" },
  "http_sites": [ { "id": "web", "port": 18080 } ],
  "cgi": [ { "id": "py", "prefix": "/", "doc_root": "../log-redaction/www", "command": "{PYTHON_BIN}", "extensions": [".py"], "timeout_ms": 15000 } ],
  "executives": { "ws": { "enabled": true, "port": 18082 } },
  "ws_profiles": [ { "id": "viewer", "token": "WSSECRETTOKEN999", "subscribe_allow": ["demo.>"], "publish_allow": ["demo.>"] } ]
}
