{
  "stdin_admin_enabled": false,
  "executives": {
    "ws": {
      "enabled": true,
      "port": 18082
    }
  },
  "ws_profiles": [
    {
      "id": "viewer",
      "token": "vt",
      "subscribe_allow": [
        "demo.>",
        "http.reply.*",
        "viewer.reply.*"
      ],
      "publish_allow": [
        "confserver.in"
      ],
      "default_subscribe": "demo.>"
    },
    {
      "id": "feeder",
      "token": "ft",
      "publish_allow": [
        "demo.>"
      ]
    },
    {
      "id": "open",
      "subscribe_allow": [
        "open.*"
      ],
      "publish_allow": [
        "open.>"
      ]
    }
  ],
  "includes": [
    "inc/extra.conf"
  ],
  "runners": [
    {
      "id": "confserver",
      "command": "php {MAIN_CONF_DIR}/../../../tools/confserver.php",
      "args": [
        "%%file%%"
      ],
      "exit_status": {
        "1": 404,
        "2": 403
      },
      "content_type": "application/json"
    }
  ]
}