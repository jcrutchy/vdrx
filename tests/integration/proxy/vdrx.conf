{ "description": "Fixture for proxy_test.py: two reverse-proxy routes (/app/ and /api, with and without a trailing slash) in front of fake upstreams that record the raw bytes they receive. Nothing is routed to /admin.",
  "stdin_admin_enabled": false,
  "http_read_timeout_ms": 1500,
  "http_request_timeout_ms": 3000,
  "http_sites": [ { "id": "web", "port": 18090, "static_dir": "www" } ],
  "processes": [
    { "id": "upstream",  "command": "python3 upstream.py 18091", "prefix": "/app/", "host": "127.0.0.1", "port": 18091 },
    { "id": "upstream2", "command": "python3 upstream.py 18092", "prefix": "/api",  "host": "127.0.0.1", "port": 18092 } ] }
