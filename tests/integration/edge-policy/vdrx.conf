{
  "description": "Fixture for edge_policy_test.py: what vdrx does to 'who is the client' request headers and which security headers it adds. Three sites share one fake upstream behind /app/.",
  "stdin_admin_enabled": false,
  "http_read_timeout_ms": 1500,
  "http_request_timeout_ms": 3000,
  "http_sites": [
    { "id": "edge",    "port": 18099,  "static_dir": "www", "headers": { "X-Frame-Options": "DENY" } },
    { "id": "trusted", "port": 18100,  "static_dir": "www", "trusted_proxies": "127.0.0.1, 10.0.0.0/8, bogus" },
    { "id": "nosec",   "port": 18102,  "static_dir": "www", "security_headers": false }
  ],
  "processes": [
    { "id": "upstream", "command": "python3 upstream.py 18101", "prefix": "/app/", "host": "127.0.0.1", "port": 18101 }
  ]
}
