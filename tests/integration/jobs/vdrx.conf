{
  "description": "Fixture for jobs_test.py: the scheduler + job runner, driven and watched over the WebSocket. Every job is a plain /bin/sh one-liner, so nothing but a shell is needed.",

  "stdin_admin_enabled": false,

  "executives": {
    "ws": { "enabled": true, "port": 18082 },
    "jobs": { "state_file": "jobs_state.json", "max_concurrent": 3, "console": true, "console_color": false }
  },

  "ws_profiles": [
    {
      "id": "operator",
      "token": "ot",
      "subscribe_allow": ["job.>", "jobs.>"],
      "publish_allow": ["jobs.run", "jobs.kill", "jobs.list"],
      "default_subscribe": "job.>"
    },
    {
      "id": "viewer",
      "token": "vt",
      "subscribe_allow": ["job.>", "jobs.>"],
      "publish_allow": ["jobs.list"],
      "default_subscribe": "job.>"
    }
  ],

  "buckets": [
    { "id": "jobs_log", "subscribe": "job.>", "file": "jobs_test.jsonl", "max_size_mb": 5 }
  ],

  "jobs": [
    { "id": "tick", "command": "/bin/sh", "args": ["-c", "echo out1; echo err1 >&2; printf 'no newline'"], "interval_sec": 2 },
    { "id": "slow", "command": "/bin/sh", "args": ["-c", "echo slow start; sleep 4; echo slow end"], "interval_sec": 1, "overlap": "skip" },
    { "id": "idle", "command": "/bin/sh", "args": ["-c", "echo never scheduled"], "interval_sec": 1, "enabled": false },

    { "id": "fail", "command": "/bin/sh", "args": ["-c", "echo about to fail; exit 3"] },
    { "id": "hang", "command": "/bin/sh", "args": ["-c", "exec sleep 30"], "timeout_sec": 1, "kill_grace_ms": 500 },
    { "id": "ansi", "command": "/bin/sh", "args": ["-c", "printf '\\033[91mred text\\033[0m\\n'"] },
    { "id": "ansiraw", "command": "/bin/sh", "args": ["-c", "printf '\\033[91mred text\\033[0m\\n'"], "strip_ansi": false },
    { "id": "envjob", "command": "/bin/sh", "args": ["-c", "echo $JOB_GREETING from $PWD"], "env": { "JOB_GREETING": "hello" }, "work_dir": "/tmp" },
    { "id": "nostart", "command": "/nonexistent/program" },

    { "id": "q", "command": "/bin/sh", "args": ["-c", "sleep 1; echo q done"], "overlap": "queue" },
    { "id": "repl", "command": "/bin/sh", "args": ["-c", "exec sleep 20"], "overlap": "kill", "kill_grace_ms": 500 },

    { "id": "cc1", "command": "/bin/sh", "args": ["-c", "sleep 2; echo cc1"] },
    { "id": "cc2", "command": "/bin/sh", "args": ["-c", "sleep 2; echo cc2"] },
    { "id": "cc3", "command": "/bin/sh", "args": ["-c", "sleep 2; echo cc3"] },
    { "id": "cc4", "command": "/bin/sh", "args": ["-c", "sleep 2; echo cc4"] },

    { "id": "long", "command": "/bin/sh", "args": ["-c", "exec sleep 61"] }
  ]
}
