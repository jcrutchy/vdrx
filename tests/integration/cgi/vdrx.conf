{
  "variables": {
    "PHP_CGI_BIN_FILENAME": "php-cgi"
  },
  "stdin_admin_enabled": false,
  "http_sites": [
    {
      "id": "web",
      "port": 18080,
      "static_dir": "static"
    }
  ],
  "rewrites": [
    {
      "match": "^/blog/([0-9]+)/?$",
      "to": "/post.php?id=$1"
    },
    {
      "match": "^/old$",
      "to": "/note.txt",
      "flag": "permanent"
    }
  ],
  "cgi": [
    {
      "id": "php",
      "prefix": "/",
      "command": "{PHP_CGI_BIN_FILENAME}",
      "doc_root": "www",
      "fallback": "/index.php",
      "timeout_ms": 3000
    },
    {
      "id": "classic",
      "prefix": "/cgi-bin/",
      "doc_root": "cgi-bin",
      "command": "",
      "extensions": [
        ".cgi"
      ],
      "timeout_ms": 3000
    }
  ]
}
