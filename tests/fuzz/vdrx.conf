{
  "description": "Fixture for fuzz.py: every kind of route a request can reach - static files, a CGI program, command-line runners, and WebSocket on both the HTTP port (/ws) and its own port.",
  "stdin_admin_enabled": false,
  "http_read_timeout_ms": 1500,
  "http_request_timeout_ms": 4000,
  "max_child_output_bytes": 1000000,
  "variables": { "PYTHON_BIN_windows": "python", "PYTHON_BIN_linux": "python3", "PYTHON_BIN": "{PYTHON_BIN_{PLATFORM}}" },
  "http_sites": [ { "id": "web", "port": 18080, "static_dir": "static", "websocket_path": "/ws", "max_connections": 200, "tls_port": 18443, "tls_cert": "cert.pem", "tls_key": "key.pem" } ],
  "http_routes": [
    { "id": "sort", "prefix": "/api/sort", "allow": "POST" },
    { "id": "head", "prefix": "/api/head", "allow": "POST" },
    { "id": "grep", "prefix": "/api/grep", "allow": "POST" }
  ],
  "runners": [
    { "id": "sort", "command": "sort" },
    { "id": "head", "command": "head", "args": ["-n", "%%n%%"] },
    { "id": "grep", "command": "grep", "args": ["-i", "-e", "%%pattern%%"], "exit_status": { "1": 404 } }
  ],
  "cgi": [ { "id": "py", "prefix": "/cgi/", "doc_root": "www", "command": "{PYTHON_BIN}", "args": ["%%script%%"], "extensions": [".py"], "timeout_ms": 2000 } ],
  "executives": { "ws": { "enabled": true, "port": 18082, "max_connections": 100, "max_frame_bytes": 65536, "frame_timeout_ms": 2000 } },
  "ws_profiles": [
    { "id": "viewer", "token": "vt", "subscribe_allow": ["demo.>"] },
    { "id": "feeder", "token": "ft", "publish_allow": ["demo.>"] }
  ]
}
