{
  "shutdown_grace_ms": 5000,
  "stdin_admin_enabled": true,
  "template_dir": "templates",
  "static_dir": "static",
  "settings": {
    "site_title": "VDRX"
  },
  "processes": [
    {
      "id": "hogircd",
      "command": "C:/dev/hogircd/hogircd.exe",
      "restart": "always",
      "graceful_timeout_ms": 500
    }
  ],
  "cli_bridges": [
    {
      "id": "phpcli1",
      "prefix": "/cli/",
      "command": "c:/php/php",
      "script_dir": "phpcli",
      "timeout_ms": 5000,
      "content_type": "text/html"
    }
  ],
  "executives": {
    "http": {
      "enabled": true,
      "port": 8081,
      "tls_port": 0,
      "tls_cert": "",
      "tls_key": ""
    },
    "ws": {
      "enabled": true,
      "port": 8082,
      "tls_port": 0,
      "tls_cert": "",
      "tls_key": ""
    }
  }
}


